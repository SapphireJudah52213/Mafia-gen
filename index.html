<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mafia Night Game</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
}

.card{
    background:#333;
    padding:20px;
    border-radius:12px;
    max-width:700px;
    margin:auto;
}

button{
    padding:12px 24px;
    font-size:18px;
    margin:8px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}

input{
    padding:10px;
    font-size:18px;
    border-radius:8px;
    border:none;
}

#role{
    font-size:48px;
    font-weight:bold;
    margin:25px;
}

.playerButton{
    display:block;
    width:250px;
    margin:8px auto;
}
</style>
</head>
<body>

<h1>Mafia Night Game</h1>

<!-- Setup -->
<div id="setup" class="card">

    <h2>Game Setup</h2>

    <p>Number of Players</p>

    <input
        type="number"
        id="playerCount"
        min="3"
        value="5"
    >

    <br><br>

    <button onclick="startGame()">
        Generate Roles
    </button>

</div>

<!-- Main Game -->
<div id="game" style="display:none;">

    <!-- Pass Device Screen -->
    <div id="hiddenScreen" class="card">

        <h2 id="playerLabel"></h2>

        <p>
            Pass the device to this player.
        </p>

        <button onclick="revealRole()">
            Reveal My Role
        </button>

    </div>

    <!-- Role Screen -->
    <div
        id="revealedScreen"
        class="card"
        style="display:none;"
    >

        <h2>Your Role</h2>

        <div id="role"></div>

        <button onclick="hideRole()">
            Continue
        </button>

    </div>

    <!-- Action Screen -->
    <div
        id="actionScreen"
        class="card"
        style="display:none;"
    >

        <h2 id="actionPlayerLabel"></h2>

        <div id="actionArea"></div>

    </div>

</div>

<!-- Results -->
<div
    id="finished"
    class="card"
    style="display:none;"
>

    <h2>Night Results</h2>

    <div id="results"></div>

</div>

<script>

let roles = [];
let currentPlayer = 0;

let mafiaTarget = null;
let nurseTarget = null;

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=Math.floor(
            Math.random()*(i+1)
        );

        [array[i],array[j]] =
        [array[j],array[i]];
    }
}

function startGame(){

    const count =
    parseInt(
        document.getElementById(
            "playerCount"
        ).value
    );

    if(count < 3){

        alert(
            "At least 3 players are required."
        );

        return;
    }

    roles = [
        "Mafia",
        "Nurse"
    ];

    while(roles.length < count){

        roles.push(
            "Innocent"
        );
    }

    shuffle(roles);

    currentPlayer = 0;

    mafiaTarget = null;
    nurseTarget = null;

    document.getElementById(
        "setup"
    ).style.display = "none";

    document.getElementById(
        "game"
    ).style.display = "block";

    updatePlayerLabel();
}

function updatePlayerLabel(){

    document.getElementById(
        "playerLabel"
    ).textContent =
    "Player " +
    (currentPlayer + 1);

    document.getElementById(
        "hiddenScreen"
    ).style.display =
    "block";

    document.getElementById(
        "revealedScreen"
    ).style.display =
    "none";

    document.getElementById(
        "actionScreen"
    ).style.display =
    "none";
}

function revealRole(){

    document.getElementById(
        "role"
    ).textContent =
    roles[currentPlayer];

    document.getElementById(
        "hiddenScreen"
    ).style.display =
    "none";

    document.getElementById(
        "revealedScreen"
    ).style.display =
    "block";
}

function hideRole(){

    document.getElementById(
        "revealedScreen"
    ).style.display =
    "none";

    document.getElementById(
        "actionScreen"
    ).style.display =
    "block";

    document.getElementById(
        "actionPlayerLabel"
    ).textContent =
    "Player " +
    (currentPlayer + 1);

    const role =
    roles[currentPlayer];

    let html = "";

    if(role === "Mafia"){

        html +=
        "<p>Select a player to eliminate:</p>";

        for(
            let i=0;
            i<roles.length;
            i++
        ){

            if(i !== currentPlayer){

                html += `
                <button
                class="playerButton"
                onclick="chooseKill(${i})">
                    Player ${i+1}
                </button>
                `;
            }
        }

    }
    else if(role === "Nurse"){

        html +=
        "<p>Select a player to protect:</p>";

        for(
            let i=0;
            i<roles.length;
            i++
        ){

            html += `
            <button
            class="playerButton"
            onclick="chooseProtect(${i})">
                Player ${i+1}
            </button>
            `;
        }

    }
    else{

        html += `
        <p>
            You have no night action.
        </p>

        <button
        onclick="nextPlayer()">
            Continue
        </button>
        `;
    }

    document.getElementById(
        "actionArea"
    ).innerHTML = html;
}

function chooseKill(player){

    mafiaTarget = player;

    nextPlayer();
}

function chooseProtect(player){

    nurseTarget = player;

    nextPlayer();
}

function nextPlayer(){

    currentPlayer++;

    if(
        currentPlayer >= roles.length
    ){

        finishNight();
        return;
    }

    updatePlayerLabel();
}

function finishNight(){

    document.getElementById(
        "game"
    ).style.display =
    "none";

    document.getElementById(
        "finished"
    ).style.display =
    "block";

    let result = "";

    if(
        mafiaTarget === null
    ){

        result = `
        <h3>
            No Mafia Action
        </h3>
        `;
    }
    else if(
        mafiaTarget === nurseTarget
    ){

        result = `
        <h3>
            Nobody Died
        </h3>

        <p>
            The Nurse successfully
            protected Player
            ${mafiaTarget + 1}.
        </p>
        `;
    }
    else{

        result = `
        <h3>
            Player
            ${mafiaTarget + 1}
            Died
        </h3>

        <p>
            The Mafia successfully
            eliminated their target.
        </p>
        `;
    }

    document.getElementById(
        "results"
    ).innerHTML =
    result;
}

</script>

</body>
</html>
