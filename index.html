<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mafia Game</title>
<style>
body{font-family:Arial,sans-serif;background:#222;color:#fff;text-align:center;padding:20px}
.card{background:#333;padding:20px;border-radius:12px;max-width:800px;margin:auto}
button{padding:12px 24px;font-size:18px;margin:8px;border:none;border-radius:8px;cursor:pointer}
input{padding:10px;font-size:18px}
#role{font-size:48px;font-weight:bold;margin:20px}
.playerButton{display:block;width:260px;margin:8px auto}
.dead{color:#ff6666}
</style>
</head>
<body>

<h1>Mafia</h1>

<div id="setup" class="card">
<h2>Game Setup</h2>
<p>Number of Players</p>
<input type="number" id="playerCount" min="4" value="6">
<br><br>
<button onclick="startGame()">Start Game</button>
</div>

<div id="game" style="display:none;">
<div id="hiddenScreen" class="card">
<h2 id="playerLabel"></h2>
<p>Pass the device to this player.</p>
<button onclick="revealRole()">Reveal My Role</button>
</div>

<div id="revealedScreen" class="card" style="display:none;">
<h2>Your Role</h2>
<div id="role"></div>
<button onclick="showActionScreen()">Continue</button>
</div>

<div id="actionScreen" class="card" style="display:none;">
<h2 id="actionPlayerLabel"></h2>
<div id="actionArea"></div>
</div>
</div>

<div id="resultsScreen" class="card" style="display:none;">
<h2 id="nightTitle"></h2>
<div id="results"></div>
<button id="startVotingBtn" onclick="startVoting()">Start Voting</button>
<button id="nextTurnBtn" onclick="nextTurn()" style="display:none;">Next Night</button>
</div>

<div id="votingScreen" class="card" style="display:none;">
<h2 id="votingTitle"></h2>
<div id="votingArea"></div>
</div>

<script>
let roles=[];
let alive=[];
let currentPlayer=0;
let turn=1;
let mafiaTarget=null;
let nurseTarget=null;

let voteCounts=[];
let votingPlayer=0;

function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
}

function startGame(){
 const count=parseInt(document.getElementById('playerCount').value);
 roles=["Mafia","Nurse","Butcher"];
 while(roles.length<count) roles.push("Innocent");
 shuffle(roles);

 alive=Array(count).fill(true);
 currentPlayer=0;
 turn=1;
 mafiaTarget=null;
 nurseTarget=null;

 document.getElementById('setup').style.display='none';
 document.getElementById('game').style.display='block';
 updatePlayerLabel();
}

function updatePlayerLabel(){
 while(currentPlayer<roles.length && !alive[currentPlayer]) currentPlayer++;
 if(currentPlayer>=roles.length){ finishNight(); return; }

 playerLabel.textContent="Player "+(currentPlayer+1);
 hiddenScreen.style.display='block';
 revealedScreen.style.display='none';
 actionScreen.style.display='none';
}

function revealRole(){
 role.textContent=roles[currentPlayer];
 hiddenScreen.style.display='none';
 revealedScreen.style.display='block';
}

function showActionScreen(){
 revealedScreen.style.display='none';
 actionScreen.style.display='block';
 actionPlayerLabel.textContent="Player "+(currentPlayer+1);

 let r=roles[currentPlayer];
 let html='';

 if(r==="Mafia"){
  html+="<p>Select a player to eliminate:</p>";
  for(let i=0;i<roles.length;i++){
   if(alive[i] && i!==currentPlayer){
    html+=`<button class="playerButton" onclick="chooseKill(${i})">Player ${i+1}</button>`;
   }
  }
 }else if(r==="Nurse"){
  html+="<p>Select a player to protect:</p>";
  for(let i=0;i<roles.length;i++){
   if(alive[i]){
    html+=`<button class="playerButton" onclick="chooseProtect(${i})">Player ${i+1}</button>`;
   }
  }
 }else if (r==="Butcher"){
  html+=`<p>You're useless.</p><button onclick="nextPlayer()">Continue</button>`;
 }else{
  html+=`<p>No night action.</p><button onclick="nextPlayer()">Continue</button>`;
 }

 actionArea.innerHTML=html;
}

function chooseKill(p){ mafiaTarget=p; nextPlayer(); }
function chooseProtect(p){ nurseTarget=p; nextPlayer(); }

function nextPlayer(){
 currentPlayer++;
 updatePlayerLabel();
}

function finishNight(){
 game.style.display='none';
 resultsScreen.style.display='block';
 nightTitle.textContent='Night '+turn+' Results';

 let html='';

 if(mafiaTarget!==null && mafiaTarget!==nurseTarget){
   alive[mafiaTarget]=false;
   html+=`<h3>Player ${mafiaTarget+1} Died</h3>`;
 }else{
   html+=`<h3>Nobody Died</h3>`;
 }

 html+="<h3>Living Players</h3>";
 for(let i=0;i<roles.length;i++){
   html+=`<p class="${alive[i]?'':'dead'}">Player ${i+1} ${alive[i]?'(Alive)':'(Dead)'}</p>`;
 }

 results.innerHTML=html;

 if(checkStandardWin()) return;

 startVotingBtn.style.display='inline-block';
 nextTurnBtn.style.display='none';
}

function startVoting(){
 voteCounts=new Array(roles.length).fill(0);
 votingPlayer=0;

 resultsScreen.style.display='none';
 nextVoter();
}

function nextVoter(){
 while(votingPlayer<roles.length && !alive[votingPlayer]) votingPlayer++;

 if(votingPlayer>=roles.length){
   finishVoting();
   return;
 }

 votingScreen.style.display='block';
 votingTitle.textContent='Player '+(votingPlayer+1)+' Vote';

 let html='<p>Select a player to vote out:</p>';

 for(let i=0;i<roles.length;i++){
   if(alive[i] && i!==votingPlayer){
      html+=`<button class="playerButton" onclick="castVote(${i})">Player ${i+1}</button>`;
   }
 }

 votingArea.innerHTML=html;
}

function castVote(target){
 voteCounts[target]++;
 votingPlayer++;
 nextVoter();
}

function finishVoting(){
 votingScreen.style.display='none';
 resultsScreen.style.display='block';

 let highest=0;
 let eliminated=-1;
 let tie=false;

 for(let i=0;i<voteCounts.length;i++){
   if(voteCounts[i]>highest){
      highest=voteCounts[i];
      eliminated=i;
      tie=false;
   }else if(voteCounts[i]===highest && highest>0){
      tie=true;
   }
 }

 let html=results.innerHTML+"<hr>";

 if(tie || eliminated===-1){
   html+="<h3>Tie Vote</h3><p>Nobody was eliminated.</p>";
 }else{
   alive[eliminated]=false;

   if(roles[eliminated]==="Butcher"){
      html+=`<h1>BUTCHER WINS!</h1><p>Player ${eliminated+1} was voted out.</p>`;
      results.innerHTML=html;
      startVotingBtn.style.display='none';
      nextTurnBtn.style.display='none';
      return;
   }

   html+=`<h3>Player ${eliminated+1} was voted out.</h3>`;
 }

 results.innerHTML=html;

 if(checkStandardWin()) return;

 startVotingBtn.style.display='none';
 nextTurnBtn.style.display='inline-block';
}

function checkStandardWin(){
 let mafia=0;
 let town=0;

 for(let i=0;i<roles.length;i++){
   if(!alive[i]) continue;

   if(roles[i]==="Mafia") mafia++;
   else if(roles[i]!=="Butcher") town++;
 }

 if(mafia===0){
   results.innerHTML += "<h2>Innocents Win!</h2>";
   startVotingBtn.style.display='none';
   nextTurnBtn.style.display='none';
   return true;
 }

 if(mafia>=town && mafia>0){
   results.innerHTML += "<h2>Mafia Wins!</h2>";
   startVotingBtn.style.display='none';
   nextTurnBtn.style.display='none';
   return true;
 }

 return false;
}

function nextTurn(){
 turn++;
 mafiaTarget=null;
 nurseTarget=null;
 currentPlayer=0;

 resultsScreen.style.display='none';
 game.style.display='block';
 updatePlayerLabel();
}
</script>
</body>
</html>
