<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mafia Game</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
}

.card{
    background:#333;
    padding:20px;
    border-radius:12px;
    max-width:700px;
    margin:auto;
}

button{
    padding:12px 24px;
    font-size:18px;
    margin:8px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}

input{
    padding:10px;
    font-size:18px;
    border-radius:8px;
    border:none;
}

#role{
    font-size:48px;
    font-weight:bold;
    margin:25px;
}

.playerButton{
    display:block;
    width:250px;
    margin:8px auto;
}

.dead{
    color:#ff6666;
}
</style>
</head>
<body>

<h1>Mafia</h1>

<!-- Setup -->
<div id="setup" class="card">
    <h2>Game Setup</h2>

    <p>Number of Players</p>

    <input
        type="number"
        id="playerCount"
        min="3"
        value="5">

    <br><br>

    <button onclick="startGame()">
        Start Game
    </button>
</div>

<!-- Main Game -->
<div id="game" style="display:none;">

    <div id="hiddenScreen" class="card">
        <h2 id="playerLabel"></h2>

        <p>
            Pass the device to this player.
        </p>

        <button onclick="revealRole()">
            Reveal My Role
        </button>
    </div>

    <div id="revealedScreen"
         class="card"
         style="display:none;">

        <h2>Your Role</h2>

        <div id="role"></div>

        <button onclick="showActionScreen()">
            Continue
        </button>
    </div>

    <div id="actionScreen"
         class="card"
         style="display:none;">

        <h2 id="actionPlayerLabel"></h2>

        <div id="actionArea"></div>
    </div>

</div>

<!-- Results -->
<div id="resultsScreen"
     class="card"
     style="display:none;">

    <h2 id="nightTitle"></h2>

    <div id="results"></div>

    <br>

    <button id="nextTurnBtn"
            onclick="nextTurn()">
        Next Turn
    </button>
</div>

<script>

let roles = [];
let alive = [];

let currentPlayer = 0;
let turn = 1;

let mafiaTarget = null;
let nurseTarget = null;

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j =
        Math.floor(
            Math.random()*(i+1)
        );

        [array[i],array[j]] =
        [array[j],array[i]];
    }
}

function startGame(){

    const count =
    parseInt(
        document.getElementById(
            "playerCount"
        ).value
    );

    if(count < 3){

        alert(
            "Need at least 3 players."
        );

        return;
    }

    roles = [
        "Mafia",
        "Nurse"
    ];

    while(
        roles.length < count
    ){
        roles.push(
            "Innocent"
        );
    }

    shuffle(roles);

    alive = [];

    for(
        let i=0;
        i<count;
        i++
    ){
        alive.push(true);
    }

    turn = 1;

    currentPlayer = 0;

    document.getElementById(
        "setup"
    ).style.display =
    "none";

    document.getElementById(
        "game"
    ).style.display =
    "block";

    updatePlayerLabel();
}

function updatePlayerLabel(){

    while(
        currentPlayer < roles.length &&
        !alive[currentPlayer]
    ){
        currentPlayer++;
    }

    if(
        currentPlayer >= roles.length
    ){
        finishNight();
        return;
    }

    document.getElementById(
        "playerLabel"
    ).textContent =
    `Player ${currentPlayer+1}`;

    document.getElementById(
        "hiddenScreen"
    ).style.display =
    "block";

    document.getElementById(
        "revealedScreen"
    ).style.display =
    "none";

    document.getElementById(
        "actionScreen"
    ).style.display =
    "none";
}

function revealRole(){

    document.getElementById(
        "role"
    ).textContent =
    roles[currentPlayer];

    document.getElementById(
        "hiddenScreen"
    ).style.display =
    "none";

    document.getElementById(
        "revealedScreen"
    ).style.display =
    "block";
}

function showActionScreen(){

    document.getElementById(
        "revealedScreen"
    ).style.display =
    "none";

    document.getElementById(
        "actionScreen"
    ).style.display =
    "block";

    document.getElementById(
        "actionPlayerLabel"
    ).textContent =
    `Player ${currentPlayer+1}`;

    let html = "";

    const role =
    roles[currentPlayer];

    if(role === "Mafia"){

        html +=
        "<p>Select a player to eliminate:</p>";

        for(
            let i=0;
            i<roles.length;
            i++
        ){

            if(
                alive[i] &&
                i !== currentPlayer
            ){

                html += `
                <button
                class="playerButton"
                onclick="chooseKill(${i})">
                Player ${i+1}
                </button>
                `;
            }
        }

    }else if(
        role === "Nurse"
    ){

        html +=
        "<p>Select a player to protect:</p>";

        for(
            let i=0;
            i<roles.length;
            i++
        ){

            if(alive[i]){

                html += `
                <button
                class="playerButton"
                onclick="chooseProtect(${i})">
                Player ${i+1}
                </button>
                `;
            }
        }

    }else{

        html += `
        <p>
        You have no action.
        </p>

        <button
        onclick="nextPlayer()">
        Continue
        </button>
        `;
    }

    document.getElementById(
        "actionArea"
    ).innerHTML = html;
}

function chooseKill(player){

    mafiaTarget = player;

    nextPlayer();
}

function chooseProtect(player){

    nurseTarget = player;

    nextPlayer();
}

function nextPlayer(){

    currentPlayer++;

    updatePlayerLabel();
}

function finishNight(){

    document.getElementById(
        "game"
    ).style.display =
    "none";

    document.getElementById(
        "resultsScreen"
    ).style.display =
    "block";

    document.getElementById(
        "nightTitle"
    ).textContent =
    `Night ${turn} Results`;

    let result = "";

    if(
        mafiaTarget !== null &&
        mafiaTarget !== nurseTarget
    ){

        alive[mafiaTarget] =
        false;

        result += `
        <h3>
        Player ${mafiaTarget+1}
        Died
        </h3>
        `;
    }
    else{

        result += `
        <h3>
        Nobody Died
        </h3>
        `;
    }

    result +=
    "<h3>Living Players</h3>";

    for(
        let i=0;
        i<roles.length;
        i++
    ){

        result += `
        <p class="${
            alive[i]
            ? ""
            : "dead"
        }">
        Player ${i+1}
        ${
            alive[i]
            ? "(Alive)"
            : "(Dead)"
        }
        </p>
        `;
    }

    document.getElementById(
        "results"
    ).innerHTML =
    result;

    checkWinCondition();
}

function checkWinCondition(){

    let mafiaAlive = 0;
    let innocentsAlive = 0;

    for(
        let i=0;
        i<roles.length;
        i++
    ){

        if(!alive[i])
            continue;

        if(
            roles[i] === "Mafia"
        ){

            mafiaAlive++;

        }else{

            innocentsAlive++;
        }
    }

    if(mafiaAlive === 0){

        document.getElementById(
            "results"
        ).innerHTML += `
        <h2>
        Innocents Win!
        </h2>
        `;

        document.getElementById(
            "nextTurnBtn"
        ).style.display =
        "none";

        return;
    }

    if(
        mafiaAlive >= innocentsAlive
    ){

        document.getElementById(
            "results"
        ).innerHTML += `
        <h2>
        Mafia Wins!
        </h2>
        `;

        document.getElementById(
            "nextTurnBtn"
        ).style.display =
        "none";

        return;
    }

    document.getElementById(
        "nextTurnBtn"
    ).style.display =
    "inline-block";
}

function nextTurn(){

    turn++;

    mafiaTarget = null;
    nurseTarget = null;

    currentPlayer = 0;

    document.getElementById(
        "resultsScreen"
    ).style.display =
    "none";

    document.getElementById(
        "game"
    ).style.display =
    "block";

    updatePlayerLabel();
}

</script>

</body>
</html>
